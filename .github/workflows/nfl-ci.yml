name: NFL APP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow

      - name: Compile protected source
        run: |
          python -m py_compile \
            current_offensive_universe.py \
            player_outlook_data.py \
            player_outlook_relevance.py \
            player_outlook_capture_reference_v1.py \
            wfs_player_outlook_rollover_v1.py \
            qb_role_authority.py

      - name: Run deterministic unit tests
        run: |
          pytest -q \
            tests/test_current_offensive_universe.py \
            tests/test_player_outlook_stage4.py \
            tests/test_weekly_roster_rollover.py
